services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collector}
      POSTGRES_USER: ${POSTGRES_USER:-collector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  collector:
    build:
      context: ../..
      dockerfile: Dockerfile.collector
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-collector}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-collector}?sslmode=disable
      COLLECTOR_TOKENS: ${COLLECTOR_TOKENS:?set COLLECTOR_TOKENS in .env}
      MIN_SUPPORTED_VERSION: ${MIN_SUPPORTED_VERSION:-1.0.0}
      COLLECTOR_LISTEN_ADDR: :8080
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-67108864}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      COLLECTOR_DOMAIN: ${COLLECTOR_DOMAIN:?set COLLECTOR_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - collector

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
